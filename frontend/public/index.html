<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#006134" />
        <meta name="description" content="EasyX - Sistema de consulta MicroXisto" />
        <meta name="google" content="notranslate" />
        <meta name="translate" content="no" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="https://customer-assets.emergentagent.com/job_product-compass-2/artifacts/anyq4exi_folha.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="EasyX" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>EasyX - MicroXisto</title>
        <style>
            /* Reset e controle de overflow */
            * {
                box-sizing: border-box;
            }
            
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            
            body {
                background-color: #f3f4f6;
            }
            
            #root {
                height: 100vh;
                overflow-y: auto;
            }
            
            /* Esconder elementos desnecessários */
            script, noscript {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <noscript>Você precisa habilitar JavaScript para usar este app.</noscript>
        <div id="root"></div>
        
        <!-- Service Worker Simples -->
        <script>
            // FORÇAR NOVA VERSÃO DO SERVICE WORKER
            if ('serviceWorker' in navigator) {
                // Desregistrar workers antigos
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
                
                // Limpar cache antigo
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        names.forEach(function(name) {
                            if (name.includes('easyx-v') && !name.includes('v5')) {
                                caches.delete(name);
                            }
                        });
                    });
                }
                
                // Registrar novo service worker
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js?v=5&t=' + Date.now())
                        .then(function(registration) {
                            console.log('✅ SW v5 registered:', registration);
                            
                            // Aguardar ativação e então cachear dados
                            registration.addEventListener('updatefound', () => {
                                const newWorker = registration.installing;
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'activated') {
                                        // Cachear dados essenciais imediatamente
                                        setTimeout(() => {
                                            newWorker.postMessage({ type: 'CACHE_DYNAMIC_DATA' });
                                        }, 1000);
                                    }
                                });
                            });
                        })
                        .catch(function(error) {
                            console.log('❌ SW registration failed:', error);
                        });
                });
            }
            
            // Forçar reload uma vez para aplicar nova versão
            if (!sessionStorage.getItem('sw-v5-loaded')) {
                sessionStorage.setItem('sw-v5-loaded', 'true');
                setTimeout(function() {
                    window.location.reload(true);
                }, 2000);
            }
        </script>
    </body>
</html>
