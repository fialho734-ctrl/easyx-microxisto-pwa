<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#006134" />
        <meta name="description" content="EasyX - Sistema de consulta MicroXisto" />
        <meta name="google" content="notranslate" />
        <meta name="translate" content="no" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="https://customer-assets.emergentagent.com/job_product-compass-2/artifacts/anyq4exi_folha.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="EasyX" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>EasyX - MicroXisto</title>
        <style>
            /* Reset e controle de overflow */
            * {
                box-sizing: border-box;
            }
            
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            
            body {
                background-color: #f3f4f6;
            }
            
            #root {
                height: 100vh;
                overflow-y: auto;
            }
            
            /* Esconder elementos desnecessários */
            script, noscript {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <noscript>Você precisa habilitar JavaScript para usar este app.</noscript>
        <div id="root"></div>
        
        <!-- Logo Emergent -->
        <a
            id="emergent-badge"
            target="_blank" 
            href="https://app.emergent.sh/?utm_source=emergent-badge"
            style="
                display: flex !important;
                align-items: center !important;
                position: fixed !important;
                bottom: 20px;
                right: 20px;
                text-decoration: none;
                padding: 6px 10px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
                font-size: 12px !important;
                z-index: 9999 !important;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
                border-radius: 8px !important;
                background-color: #ffffff !important;
                border: 1px solid rgba(255, 255, 255, 0.25) !important;
            "
        >
            <div style="display: flex; flex-direction: row; align-items: center">
                <img
                    style="width: 20px; height: 20px; margin-right: 8px"
                    src="https://avatars.githubusercontent.com/in/1201222?s=120&u=2686cf91179bbafbc7a71bfbc43004cf9ae1acea&v=4"
                    alt="Emergent"
                />
                <p style="color: #000000; font-size: 12px !important; margin: 0;">
                    Made with Emergent
                </p>
            </div>
        </a>
        
        <!-- Service Worker Simples -->
        <script>
            // Limpar cache antigo apenas uma vez
            if ('caches' in window && !sessionStorage.getItem('cache-cleared-v2')) {
                caches.keys().then(function(names) {
                    names.forEach(function(name) {
                        if (name.includes('easyx-v1')) {
                            caches.delete(name);
                        }
                    });
                });
                sessionStorage.setItem('cache-cleared-v2', 'true');
            }
            
            // Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js');
                });
            }
        </script>
    </body>
</html>
