<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#006134" />
        <meta name="description" content="EasyX - Sistema de consulta MicroXisto" />
        <meta name="google" content="notranslate" />
        <meta name="translate" content="no" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="https://customer-assets.emergentagent.com/job_product-compass-2/artifacts/anyq4exi_folha.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="EasyX" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>EasyX - MicroXisto</title>
        <style>
            /* Reset e controle de overflow */
            * {
                box-sizing: border-box;
            }
            
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            
            body {
                background-color: #f3f4f6;
            }
            
            #root {
                height: 100vh;
                overflow-y: auto;
            }
            
            /* Esconder elementos desnecessários */
            script, noscript {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <noscript>Você precisa habilitar JavaScript para usar este app.</noscript>
        <div id="root"></div>
        
        <!-- Service Worker Simples -->
        <script>
            // FORÇAR ATUALIZAÇÃO NO MOBILE
            if ('serviceWorker' in navigator) {
                // Desregistrar workers antigos
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
                
                // Limpar cache antigo
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        names.forEach(function(name) {
                            if (name.includes('easyx-v1') || name.includes('easyx-v2')) {
                                caches.delete(name);
                            }
                        });
                    });
                }
                
                // Registrar novo service worker
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js?v=3&t=' + Date.now())
                        .then(function(registration) {
                            console.log('SW atualizado:', registration);
                        });
                });
            }
            
            // Forçar reload uma vez para limpar cache
            if (!sessionStorage.getItem('force-updated-v3')) {
                sessionStorage.setItem('force-updated-v3', 'true');
                setTimeout(function() {
                    window.location.reload(true);
                }, 1000);
            }
        </script>
    </body>
</html>
